<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T3chCollab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #eef8f3;
      font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(92, 255, 200, 0.22), transparent 28%),
        radial-gradient(circle at 82% 78%, rgba(255, 204, 102, 0.16), transparent 30%),
        linear-gradient(135deg, #050608, #091018 52%, #020302);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      background:
        linear-gradient(rgba(92,255,200,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92,255,200,0.045) 1px, transparent 1px);
      background-size: 46px 46px;
      transform: perspective(700px) rotateX(58deg) translateY(18%);
      animation: gridDrift 16s linear infinite;
    }

    .loader {
      position: relative;
      z-index: 1;
      width: min(88vw, 430px);
      padding: 42px 34px;
      border: 1px solid rgba(157, 255, 222, 0.20);
      border-radius: 30px;
      text-align: left;
      background: rgba(12, 17, 24, 0.80);
      box-shadow: 0 30px 100px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(22px) saturate(135%);
    }

    .loader h1 {
      font-size: clamp(42px, 12vw, 68px);
      line-height: 0.86;
      letter-spacing: -0.08em;
      color: #eef8f3;
    }

    .loader h1 span {
      color: #5cffc8;
      font-weight: 500;
    }

    .spinner {
      width: 100%;
      height: 4px;
      margin: 28px 0 16px;
      border-radius: 999px;
      background: rgba(157,255,222,0.12);
      overflow: hidden;
    }

    .spinner::before {
      content: '';
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #5cffc8, #ffcc66);
      box-shadow: 0 0 28px rgba(92,255,200,0.45);
      animation: scan 900ms ease-in-out infinite alternate;
    }

    .loader p {
      color: #8da19a;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @keyframes scan {
      to { transform: translateX(140%); }
    }

    @keyframes gridDrift {
      to { background-position: 0 46px, 46px 0; }
    }
  </style>
</head>

<body>
  <div class="loader">
    <h1>T3ch<span>Collab</span></h1>
    <div class="spinner"></div>
    <p>Syncing private signal...</p>
  </div>

  <script type="module">
    import { initializeApp, appState } from './src/js/state.js'

    async function redirect() {
      await initializeApp()

      if (appState.isAuthenticated) {
        window.location.href = '/src/pages/app.html'
      } else {
        window.location.href = '/src/pages/login.html'
      }
    }

    redirect()
  </script>
</body>
</html>
