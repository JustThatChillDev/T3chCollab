<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T3chCollab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader {
      text-align: center;
    }

    .loader h1 {
      font-size: 32px;
      color: #1a1a2e;
    }

    .loader h1 span {
      color: #4a6cf7;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 20px auto;
      border: 4px solid #e5e7eb;
      border-top-color: #4a6cf7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="loader">
    <h1>T3ch<span>Collab</span></h1>
    <div class="spinner"></div>
    <p style="color:#6b7280;">Loading...</p>
  </div>

  <script type="module">
    import { initializeApp, appState } from './src/js/state.js'

    async function redirect() {
      await initializeApp()

      if (appState.isAuthenticated) {
        window.location.href = '/src/pages/app.html'
      } else {
        window.location.href = '/src/pages/login.html'
      }
    }

    redirect()
  </script>
</body>
</html>
